<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherMap</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1 class="page-title">WeatherMap</h1>
    </header>

    <main>
        <form id="weather-form" class="search-form">
            <label for="location-input">Please enter location</label>
            <input type="text" id="location-input" placeholder="Search for a location" autocomplete="off" required>
            <button type="submit" id="get-weather-btn">Get Weather</button>
        </form>

        <div id="spinner" class="spinner hidden" aria-label="Loading"></div>
        <div id="error-card" class="error-card hidden" role="alert"></div>

        <div id="map"></div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <script src="app.js"></script>
</body>

</html>
